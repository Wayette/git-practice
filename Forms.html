<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-sm-4">
            <form action="">
                <div class="mt-3 mb-3">
                    <label for="first-name" class="form-label">First Name</label>
                    <input type="text" class="form-control rounded-0" id="first-name">
                </div>
                <div class="mt-3 mb-3">
                    <label for="second-name" class="form-label">Second Name</label>
                    <input type="text" class="form-control rounded-0" id="second-name">
                </div>
                <div class="mt-3 mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="text" class="form-control rounded-0" id="password">
                </div>



            </form>
        </div>
    </div>
</div>

</body>
</html>
